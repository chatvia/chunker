[project]
name = "chunker"
version = "0.2.0"
description = "Stateless HTTP API for RAG text chunking and embeddings with LangChain, LlamaIndex and Chonkie"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # HTTP API
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "httpx>=0.28.1",
    # Engines
    "langchain-text-splitters>=1.1.3",
    "llama-index-core>=0.14.25",
    "chonkie[code,tiktoken]>=1.7.0",
    # Tokens and embeddings
    "tiktoken>=0.14.0",
    "openai>=3.42.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "langchain-core>=1.7.4",
]

[project.scripts]
chunker = "app.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.uv]
# NLTK (used by LlamaIndex and LangChain sentence splitting) refuses to read hardlinked data
# files, and uv hardlinks from its cache by default on Linux.
link-mode = "copy"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
    "ASYNC", "S", "PT", "PTH", "T20", "FAST",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
