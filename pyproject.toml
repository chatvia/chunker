[project]
name = "chunker"
version = "0.1.0"
description = "FastAPI service for intelligent text chunking using LangChain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "tiktoken>=0.8.0",
    "pydantic>=2.0.0",
    "python-magic>=0.4.27",
    "mistralai>=1.10.0",
    "python-dotenv>=1.2.1",
    "httpx>=0.28.1",
    "openai>=2.14.0",
    "langchain-openai>=1.1.6",
    "sqlalchemy>=2.0.45",
    "asyncpg>=0.29.0",
    "greenlet>=3.3.0",
    "boto3>=1.35.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

