[project]
name = "chunker"
version = "0.2.0"
description = "Stateless HTTP API for RAG document parsing, chunking and embeddings with LangChain, LlamaIndex, Unstructured and Chonkie"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # HTTP API
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    # Engines
    "langchain-text-splitters>=1.1.3",
    "llama-index-core>=0.14.25",
    "llama-index-readers-file>=0.7.0",
    "docx2txt>=0.9",  # LlamaIndex .docx reader
    "chonkie[tiktoken]>=1.7.0",
    "unstructured[docx,md,pdf,pptx,xlsx]>=0.27.25",
    "torch>=2.14.1",  # needed by unstructured[pdf]; declared so Linux gets CPU-only wheels
    # spaCy model used by unstructured; pinned so it is not downloaded at runtime.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # Tokens and embeddings
    "tiktoken>=0.14.0",
    "openai>=3.29.0",
]

[project.scripts]
chunker = "app.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv.sources]
# unstructured[pdf] needs torch; use CPU-only wheels on Linux to avoid ~3GB of CUDA libraries.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
    "ASYNC", "S", "PT", "PTH", "T20", "FAST",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
