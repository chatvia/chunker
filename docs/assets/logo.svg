<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Chunker</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#tile)"/>
  <!-- A document sliced into three chunks; the middle chunk is pulled out. -->
  <g transform="translate(-4 0)">
  <g fill="#FFFFFF">
    <path d="M42 22h36l16 16v10H34V30a8 8 0 0 1 8-8z"/>
    <rect x="44" y="55" width="60" height="21" rx="3"/>
    <path d="M34 83h60v15a8 8 0 0 1-8 8H42a8 8 0 0 1-8-8z"/>
  </g>
  <path d="M78 22v10a6 6 0 0 0 6 6h10z" fill="#C7D2FE"/>
  <g fill="#6366F1" fill-opacity="0.35">
    <rect x="42" y="31" width="26" height="5" rx="2.5"/>
    <rect x="52" y="63" width="40" height="5" rx="2.5"/>
    <rect x="42" y="91" width="34" height="5" rx="2.5"/>
  </g>
  </g>
</svg>
