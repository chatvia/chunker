# Static checks, run on every commit locally and on every push in CI.
#   uvx pre-commit install              # once per clone
#   uvx pre-commit run --all-files      # on demand
# Python tools run from the locked dev environment (uv run), so versions match uv.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy (strict)
        entry: uv run --frozen mypy app tests
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: uv-lock
        name: uv.lock is up to date
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: hadolint
        name: hadolint
        entry: uvx --from hadolint-bin==2.15.1 hadolint
        language: system
        files: (^|/)Dockerfile$

      - id: shellcheck
        name: shellcheck
        entry: uvx --from shellcheck-py==0.11.0.1 shellcheck
        language: system
        types: [shell]

      - id: actionlint
        name: actionlint
        entry: uvx --from actionlint-py==1.7.12.25 actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: zizmor
        name: zizmor (workflow security)
        entry: uvx zizmor@1.30.1 --offline
        language: system
        files: ^\.github/(workflows/.*\.ya?ml|dependabot\.ya?ml)$
